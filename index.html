<script>
/* ================= CONSTANTS & DEFAULTS ================= */
const DEPARTMENTS = [

/* دول باسوردات مبدئية بس (bootstrap) لأول تشغيل فاضي - بيتم عمل hash ليها تلقائيًا فور تشغيل التطبيق (migratePlaintextPasswords)، فمبتفضلش نص صريح مخزن. غيّر الباسوردات دي فورًا بعد أول تسجيل دخول. */

  { id: 'W-003', name: 'مصطفى سعيد محمد', code: 'W-003', shiftId: 'shift_m', deptKey: 'shipping', active: true },
  { id: 'W-004', name: 'محمد عبد المجيد محمد', code: 'W-004', shiftId: 'shift_m', deptKey: 'scanning', active: true },
  { id: 'W-005', name: 'السيد ياسر محمد', code: 'W-005', shiftId: 'shift_m', deptKey: 'floor', active: true },
  { id: 'W-006', name: 'أحمد بدر عبد الرحيم', code: 'W-006', shiftId: 'shift_e', deptKey: 'picking', active: true },
  { id: 'W-007', name: 'ضياء محمد قاسم', code: 'W-007', shiftId: 'shift_e', deptKey: 'shipping', active: true },
  { id: 'W-008', name: 'طه فتحي فرغلي', code: 'W-008', shiftId: 'shift_e', deptKey: 'scanning', active: true },
  { id: 'W-009', name: 'محمد فوزي علي', code: 'W-009', shiftId: 'shift_e', deptKey: 'floor', active: true },
  { id: 'W-010', name: 'عمرو كامل عبد الصمد', code: 'W-010', shiftId: 'shift_e', deptKey: 'picking', active: true }
];

function getDefaultState() {
  return {
    theme: 'light',
    loggedInUserId: null,
    activeScreen: 'dashboard',
    workers: INITIAL_WORKERS,
    shifts: INITIAL_SHIFTS,
    users: INITIAL_USERS,
    reports: [],
    telegram: { botToken: '', chatId: '', autoSend: true, bots: [], activeBotId: '' },
    activeWizard: null
  };
}

let state = getDefaultState();

/* ================= STORAGE (Firestore real-time sync) ================= */
/* حقول صغيرة وأساسية بتتخزن في مستند واحد "core/data" */
const CORE_FIELDS = ['workers','users','shifts','telegram','leaveBatchId','pendingLeaves','seasonalAssignments'];
/* سجلات متنامية (تقارير، مهام مخزن، إجازات، تغييرات شفت) - كل واحدة في Collection منفصلة، مستند لكل عنصر */
const GROWING_COLLECTIONS = ['reports','warehouseTasks','leaves','shiftChanges'];

let _fbReady = false;
let _fbListenersAttached = false;
let _syncCache = { reports:{}, warehouseTasks:{}, leaves:{}, shiftChanges:{} };

function localSnapshot() {
  try { localStorage.setItem('saudi_wh_state_v3', JSON.stringify(state)); } catch (e) {}
}

async function syncGrowingCollection(name, arr) {
  const cache = _syncCache[name];
  const list = Array.isArray(arr) ? arr : [];
  const currentIds = new Set(list.map(x => x && x.id).filter(Boolean));
  const deletedIds = Object.keys(cache).filter(id => !currentIds.has(id));
  for (const id of deletedIds) {
    try { await db.collection(name).doc(id).delete(); } catch (e) {}
    delete cache[id];
  }
  for (const item of list) {
    if (!item || !item.id) continue;
    const json = JSON.stringify(item);
    if (cache[item.id] === json) continue;
    try {
      await db.collection(name).doc(String(item.id)).set(item);
      cache[item.id] = json;
    } catch (e) { console.error('Firestore sync error:', name, item.id, e); }
  }
}

async function saveState() {
  ensureV2State();
  localSnapshot();
  if (!_fbReady) return;
  try {
    const core = {};
    CORE_FIELDS.forEach(k => { core[k] = state[k]; });
    core._updatedAt = Date.now();
    await db.collection('core').doc('data').set(core);
    for (const name of GROWING_COLLECTIONS) {
      await syncGrowingCollection(name, state[name]);
    }
  } catch (e) { console.error('Firestore save error:', e); }
}

async function loadState() {
  try {
    const data = localStorage.getItem('saudi_wh_state_v3');
    if (data) {
      const parsed = JSON.parse(data);
      state = Object.assign(getDefaultState(), parsed);
    }
  } catch (e) {}
}

function attachRealtimeSync() {
  if (_fbListenersAttached) return;
  _fbListenersAttached = true;

  db.collection('core').doc('data').onSnapshot(async snap => {
    if (!snap.exists) {
      _fbReady = true;
      await saveState();
      return;
    }
    const data = snap.data();
    CORE_FIELDS.forEach(k => { if (data[k] !== undefined) state[k] = data[k]; });
    ensureV2State();
    await migratePlaintextPasswords();
    _fbReady = true;
    renderApp();
  }, err => console.error('core snapshot error', err));

  GROWING_COLLECTIONS.forEach(name => {
    db.collection(name).onSnapshot(snap => {
      const arr = [];
      snap.forEach(doc => arr.push(doc.data()));
      arr.sort((a, b) => String(b.createdAt || b.at || '').localeCompare(String(a.createdAt || a.at || '')));
      state[name] = arr;
      const cache = _syncCache[name];
      Object.keys(cache).forEach(k => delete cache[k]);
      arr.forEach(item => { if (item && item.id) cache[item.id] = JSON.stringify(item); });
      renderApp();
    }, err => console.error(name + ' snapshot error', err));
  });
}

let saveTimer;
function queueSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 300);
}

// Re-sync automatically when the browser comes back online.
window.addEventListener('online', () => {
  if (_fbReady) saveState().catch(e => console.error('Firestore online resync error:', e));
});

/* ================= HELPERS ================= */
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function openModal(html) {
  const sheet = document.getElementById('modalSheet');
  sheet.innerHTML = html;
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}

function dateTodayLabel() {
  const d = new Date();
  return d.toLocaleDateString('ar-EG', { day: 'numeric', month: 'long', year: 'numeric' });
}

function getLoggedInUser() {
  return state.users.find(u => u.id === state.loggedInUserId) || null;
}

function getWorkerDisplayName(worker, allWorkers) {
  const parts = worker.name.trim().split(/\s+/);
  let shortName = parts.length >= 2 ? `${parts[0]} ${parts[1]}` : parts[0];
  
  const hasDuplicate = allWorkers.some(other => 
    other.id !== worker.id && 
    other.shiftId === worker.shiftId && 
    other.name.trim().split(/\s+/).slice(0, 2).join(' ') === shortName
  );

  if (hasDuplicate) {
    if (parts.length >= 3) {
      return `${parts[0]} ${parts[1]} ${parts[2]}`;
    } else {
      return `${shortName} (${worker.code})`;
    }
  }

  return shortName;
}

/* ================= RENDER SYSTEM ================= */
function renderApp() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('themeBtn').textContent = state.theme === 'dark' ? '☀️' : '🌙';

  const user = getLoggedInUser();

  if (!user) {
    document.getElementById('appHeader').style.display = 'none';
    document.getElementById('bottomNav').style.display = 'none';
    document.getElementById('app').innerHTML = renderLoginScreen();
    attachEvents();
    return;
  }

  document.getElementById('appHeader').style.display = 'flex';
  document.getElementById('bottomNav').style.display = 'flex';
  document.getElementById('headerRole').textContent = `${user.name} (${user.role === 'admin' ? 'مشرف رئيسي' : 'مسؤول شفت'})`;

  renderNav();

  const app = document.getElementById('app');
  switch (state.activeScreen) {
    case 'dashboard': app.innerHTML = renderDashboard(); break;
    case 'workers': app.innerHTML = renderWorkersScreen(); break;
    case 'shifts': app.innerHTML = renderShiftsScreen(); break;
    case 'users': app.innerHTML = renderUsersScreen(); break;
    case 'wizard': app.innerHTML = renderWizardScreen(); break;
    case 'reports': app.innerHTML = renderReportsScreen(); break;
    case 'settings': app.innerHTML = renderSettingsScreen(); break;
    default: app.innerHTML = renderDashboard();
  }

  attachEvents();
}

function renderNav() {

  const isAdmin = user && user.role === 'admin';
  const nav = document.getElementById('bottomNav');
  
  let html = `

      </button>
    `;
  }

  html += `

      <button class="nav-fab-btn" onclick="startNewReport()">➕</button>
    </div>
    <button class="nav-item ${state.activeScreen==='reports'?'active':''}" onclick="setScreen('reports')">
      <span>📊</span><span>التقارير</span>
    </button>
  `;

  if (isAdmin) {
    html += `
      <button class="nav-item ${state.activeScreen==='settings'?'active':''}" onclick="setScreen('settings')">

    renderApp();
  } else {

}

let bulkWorkerRowSeq = 0;
function openBulkAddWorkerModal() {
  bulkWorkerRowSeq = 0;
  openModal(`
    <div class="modal-header">
      <h3 style="margin:0;">📋 إضافة دفعة عمال</h3>
      <button class="icon-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="muted" style="margin-bottom:8px;">أضف صف لكل عامل (خانة للاسم وخانة للكود)، وزوّد صفوف حسب عدد العمال.</div>
    <div id="bulkWorkerRows"></div>
    <button type="button" class="btn btn-secondary" style="width:100%;margin-top:8px;" onclick="addBulkWorkerRow()">➕ إضافة صف عامل</button>
    <div class="muted" style="margin-top:10px;">سيتم إضافة العمال كـ "غير موزعين" (بدون شفت أو قسم)، وزّعهم بعد كده من شاشة 🧩 توزيع الأقسام. لو في أي خطأ (اسم أو كود ناقص، أو كود مكرر) مش هيتضاف أي عامل خالص وهنقولك الصف اللي فيه المشكلة بالظبط.</div>
    <button class="btn btn-primary" style="width:100%;margin-top:14px;" onclick="handleBulkAddWorkers()">➕ إضافة الكل</button>
  `);
  addBulkWorkerRow(); addBulkWorkerRow(); addBulkWorkerRow();
}

function addBulkWorkerRow(){
  const wrap = document.getElementById('bulkWorkerRows');
  if(!wrap) return;
  bulkWorkerRowSeq++;
  const rid = bulkWorkerRowSeq;
  const row = document.createElement('div');
  row.id = 'bulkRow' + rid;
  row.style.cssText = 'display:flex;gap:6px;align-items:center;margin-top:8px;';
  row.innerHTML = `
    <input class="input" style="flex:2;margin-top:0;" placeholder="اسم العامل" data-role="bulkName">
    <input class="input" style="flex:1;margin-top:0;" placeholder="الكود" data-role="bulkCode">
    <button type="button" class="icon-btn" onclick="removeBulkWorkerRow(${rid})" title="حذف الصف">✕</button>
  `;
  wrap.appendChild(row);
}

function removeBulkWorkerRow(rid){
  const row = document.getElementById('bulkRow' + rid);
  if(row) row.remove();
}

function handleBulkAddWorkers(){
  const wrap = document.getElementById('bulkWorkerRows');
  if(!wrap) return;
  const rows = Array.from(wrap.children);
  const existingCodes = new Set(state.workers.map(w=>w.code));
  const seenInBatch = new Set();
  const toAdd = [];
  const errors = [];

  rows.forEach((row, idx)=>{
    const nameEl = row.querySelector('[data-role="bulkName"]');
    const codeEl = row.querySelector('[data-role="bulkCode"]');
    const name = nameEl ? nameEl.value.trim() : '';
    const code = codeEl ? codeEl.value.trim() : '';
    if(!name && !code) return; // صف فاضي بالكامل، اتجاهله بهدوء
    if(!name || !code){ errors.push(`الصف ${idx+1}: لازم الاسم والكود مع بعض`); return; }
    if(existingCodes.has(code) || seenInBatch.has(code)){ errors.push(`الصف ${idx+1}: الكود "${code}" مستخدم بالفعل`); return; }
    seenInBatch.add(code);
    toAdd.push({ name, code });
  });

  if(errors.length){ toast('🔴 ' + errors[0] + (errors.length>1 ? ` (و${errors.length-1} خطأ تاني)` : '')); return; }
  if(!toAdd.length){ toast('اكتب عامل واحد على الأقل (اسم + كود)'); return; }

  toAdd.forEach((w, i)=>{
    const id = 'W-' + Date.now().toString().slice(-6) + '-' + i + '-' + Math.random().toString(36).slice(2,5);
    state.workers.push({ id, name:w.name, code:w.code, shiftId:null, deptKey:null, active:true, present:true });
  });
  queueSave();
  closeModal();
  toast(`🟢 تم إضافة ${toAdd.length} عامل بنجاح`);
  renderApp();
}

  const defaultShiftId = user.role === 'supervisor' && user.shiftId ? user.shiftId : 'shift_m';

  state.activeWizard = {
    step: 1,
    shiftId: defaultShiftId,
    attendance: {},
    depts: { picking: [], shipping: [], scanning: [], floor: [] },
    ops: { truckCount: 0, status: 'ممتاز', notes: '', issues: '' }
  };

  const activeShiftWorkers = state.workers.filter(w => w.active && w.shiftId === defaultShiftId);
  activeShiftWorkers.forEach(w => {

    if (state.activeWizard.depts[w.deptKey]) {
      state.activeWizard.depts[w.deptKey].push(w.id);

  // لو الحالة غياب (بإذن أو بدون إذن)، يتشال فوراً من كل الأقسام
  if (statusKey === 'absent' || statusKey === 'absent_perm') {
    const depts = state.activeWizard.depts;
    Object.keys(depts).forEach(k => {
      depts[k] = depts[k].filter(id => id !== workerId);
    });
  }

    if (state.activeWizard.depts[w.deptKey]) {

  const issuesEl = document.getElementById('wizIssues');

  const snapshot = {
    id: 'REP-' + Date.now(),
    date: dateTodayLabel(),

    shiftName: shift.name,
    shiftTimes: `${shift.startTime} → ${shift.endTime}`,

/* ================= TELEGRAM INTEGRATION ================= */
/* يهرّب الرموز الخاصة بصيغة Markdown القديمة في Telegram (_ * ` [ ]) عشان أي حرف زيادة يكتبه المشرف
   في اسم عامل أو ملاحظة (زي "-" أو "*" أو "_") ميبوظش الرسالة كلها ويوقف الإرسال بسبب Bad Request. */
function escTgMd(s){
  return String(s==null?'':s).replace(/([_*`\[\]])/g, '\\$1');
}
async function sendTelegramReport(rep) {
  const notesText = (rep.ops && rep.ops.notes && rep.ops.notes.trim() !== '') ? escTgMd(rep.ops.notes.trim()) : 'لا يوجد';
  const issuesText = (rep.ops && rep.ops.issues && rep.ops.issues.trim() !== '') ? escTgMd(rep.ops.issues.trim()) : 'لا يوجد مشاكل أو أعطال';

  // تجميع تفاصيل الحضور والغياب مع توضيح الحالة بالضبط
  let attendanceSummary = [];
  Object.keys(rep.attendance).forEach(wId => {
    const w = state.workers.find(x => x.id === wId);
    const stKey = rep.attendance[wId];
    const stObj = ATTENDANCE_OPTIONS.find(o => o.key === stKey);
    if (w && stObj) {
      attendanceSummary.push(`• ${escTgMd(w.name)}: [${stObj.tag}]`);
    }
  });

  const attendanceStr = attendanceSummary.length > 0 ? attendanceSummary.join('\n') : 'لا يوجد عمال مسجلين';

  // تجميع توزيع العمال الحاضرين على الأقسام
  let deptSummary = [];
  DEPARTMENTS.forEach(d => {
    const workerIds = rep.departments[d.key] || [];
    const names = workerIds.map(id => {
      const w = state.workers.find(x => x.id === id);
      return w ? escTgMd(w.name) : '';
    }).filter(n => n !== '');

    if (names.length > 0) {
      deptSummary.push(`🔹 *${d.ar}* (${names.length}):\n  └ ${names.join('، ')}`);
    }
  });

  const deptStr = deptSummary.length > 0 ? deptSummary.join('\n\n') : 'لم يتم توزيع عمال على الأقسام';

  const text = `🏢 *Saudi Market - Warehouse Operations*
📅 *التاريخ:* ${escTgMd(rep.date)}
🕐 *الوردية:* ${escTgMd(rep.shiftName)} (${escTgMd(rep.shiftTimes)})
👨‍💼 *محرر التقرير:* ${escTgMd(rep.supervisor)}
👷 *إجمالي العمال:* ${rep.workersCount}

-----------------------------------
📋 *كشف حالات وحضور العمال:*
${attendanceStr}

-----------------------------------
🏗️ *توزيع العمال على الأقسام:*
${deptStr}

-----------------------------------
🚚 *سيارات الشحن:* ${rep.ops.truckCount || 0}
📝 *الملاحظات العامة:* ${notesText}
⚠️ *مشاكل الترانس بلت والتشغيل:* ${issuesText}`;

  try {
    const bot = getActiveTelegramBot();
    if (!bot?.botToken || !bot?.chatId) { toast('⚠️ لم يتم ضبط بوت Telegram النشط'); return; }
    const res = await fetch(`https://api.telegram.org/bot${encodeURIComponent(bot.botToken)}/sendMessage`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chat_id: bot.chatId, text, parse_mode: 'Markdown' })
    });
    if (res.ok) {
      rep.telegramSent = true;
      rep.telegramBotId = bot.id;
      queueSave();
      toast(`🟢 تم الإرسال عبر ${bot.name}`);
    } else {
      // نعرض سبب الفشل الحقيقي من Telegram بدل رسالة عامة، عشان تعرف بالظبط لو المشكلة Token غلط
      // أو Chat ID غلط أو حاجة تانية.
      let j = {}; try { j = await res.json(); } catch (e) {}
      toast('🔴 فشل إرسال Telegram' + (j.description ? ': ' + j.description : '، راجع بيانات البوت'));
    }
  } catch (e) { toast('🔴 تعذر الاتصال بـ Telegram'); }
}

function resendTelegram(reportId) {
  const r = state.reports.find(x => x.id === reportId);
  if (r) {
    sendTelegramReport(r);
    toast('جاري إعادة الإرسال...');
  }
}

/* ================= SETTINGS ================= */
function ensureTelegramBots(){
  state.telegram = state.telegram || {botToken:'',chatId:'',autoSend:true,bots:[],activeBotId:''};
  state.telegram.bots = Array.isArray(state.telegram.bots) ? state.telegram.bots : [];
  // Backward compatibility with the old single-bot fields.
  if (!state.telegram.bots.length && state.telegram.botToken && state.telegram.chatId){
    state.telegram.bots.push({id:'TG-'+Date.now(),name:'البوت الحالي',botToken:state.telegram.botToken,chatId:state.telegram.chatId,active:true});
  }
  if (!state.telegram.activeBotId && state.telegram.bots.length) state.telegram.activeBotId = state.telegram.bots[0].id;
  const active = state.telegram.bots.find(b=>b.id===state.telegram.activeBotId) || state.telegram.bots[0];
  if (active){ state.telegram.activeBotId=active.id; state.telegram.botToken=active.botToken; state.telegram.chatId=active.chatId; }
}
ensureTelegramBots();
function getActiveTelegramBot(){
  ensureTelegramBots();

  if(!isAdmin()) return;
  const name=document.getElementById('tgBotName')?.value.trim()||'بوت Telegram';

function escapeHtml(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}

/* ================= PASSWORD SECURITY ================= */
/* كلمات السر مبتتخزنش نص صريح (plaintext) أبدًا. بيتم عمل hash ليها بـ SHA-256 مع salt عشوائي مختلف لكل مستخدم. */
function genSalt(){
  const arr = new Uint8Array(16);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function hashPassword(password, salt) {
  const enc = new TextEncoder();
  const buf = await crypto.subtle.digest('SHA-256', enc.encode(salt + ':' + password));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
async function setUserPassword(user, plainPassword) {
  user.passwordSalt = genSalt();
  user.passwordHash = await hashPassword(plainPassword, user.passwordSalt);
  delete user.password; // تأكيد إن مفيش نص صريح فاضل في الكائن
}
async function verifyUserPassword(user, plainPassword) {
  if (!user || !user.passwordHash || !user.passwordSalt) return false;
  const h = await hashPassword(plainPassword, user.passwordSalt);
  return h === user.passwordHash;
}
/* بيرحّل أي كلمات سر قديمة متخزنة نص صريح (من نسخة سابقة من التطبيق أو من Firestore) لصيغة الـ hash تلقائيًا. */
async function migratePlaintextPasswords() {
  let changed = false;
  for (const u of (state.users || [])) {
    if (u.password !== undefined && u.password !== null && u.password !== '') {
      await setUserPassword(u, String(u.password));
      changed = true;
    } else if (u.password === '') {
      delete u.password;
    }
  }
  if (changed) queueSave();
}
function currentUser(){return getLoggedInUser()||{};}
function isAdmin(){return currentUser().role==='admin';}
function workerById(id){return state.workers.find(w=>w.id===id);}
function shiftById(id){return state.shifts.find(s=>s.id===id);}
function daysDiff(a,b){const x=new Date(a),y=new Date(b);return Math.max(0,Math.round((y-x)/86400000)+1);}
function annualUsed(workerId){const committed=state.leaves.filter(x=>x.workerId===workerId&&x.type==='annual').reduce((n,x)=>n+Number(x.days||0),0);const pending=state.pendingLeaves.filter(x=>x.workerId===workerId&&x.type==='annual').reduce((n,x)=>n+Number(x.days||0),0);return committed+pending;}
function annualBalance(w){const total=Number(w.annualTotal??21);return Math.max(0,total-annualUsed(w.id));}
function setAnnualRemaining(workerId,remaining){const w=workerById(workerId);if(!w)return false;const used=annualUsed(workerId);const r=Number(remaining);if(!Number.isFinite(r)||r<0)return false;w.annualTotal=used+r;syncMark('leave_balance_update',{workerId:w.id,name:w.name,code:w.code,used,beforeRemaining:annualBalance(w),remaining:r,annualTotal:w.annualTotal,by:currentUser().name,at:new Date().toISOString()});queueSave();return true;}
function seasonalLabel(v){return v==='conveyor'?'عمال معدات السيور':v==='dock'?'عمال معدات الرصيف':'غير موزع';}

async function compressImage(file,max=1000,quality=.68){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const scale=Math.min(1,max/Math.max(w,h));w=Math.round(w*scale);h=Math.round(h*scale);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',quality));};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)});}
function cameraField(id,previewId){return `<input class="input" type="file" accept="image/*" capture="environment" onchange="handlePhotoFile(event,'${previewId}')" id="${id}"><img id="${previewId}" class="photo-preview" style="display:none">`;}
async function handlePhotoFile(e,previewId){const f=e.target.files?.[0];if(!f)return;try{const data=await compressImage(f);const img=document.getElementById(previewId);img.src=data;img.style.display='block';img.dataset.value=data;}catch(err){toast('تعذر معالجة الصورة، اختر صورة أخرى');}}

const LEAVE_DAYS=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
function localISO(d){const x=new Date(d);x.setHours(12,0,0,0);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;}
function parseLocalISO(v){const [y,m,d]=String(v||'').split('-').map(Number);return new Date(y||2026,(m||1)-1,d||1,12);}
function weekSaturday(v){const d=parseLocalISO(v||localISO(new Date()));const back=(d.getDay()+1)%7;d.setDate(d.getDate()-back);return d;}
function leaveWindowDates(startValue){const base=weekSaturday(startValue);return Array.from({length:14},(_,i)=>{const d=new Date(base);d.setDate(base.getDate()+i);return {date:localISO(d),day:LEAVE_DAYS[i%7]};});}

/* ================= TELEGRAM PHOTO SENDING (for all report/print buttons) ================= */
async function sendTelegramPhoto(dataUrl, caption){
  try{
    const bot=getActiveTelegramBot();
    if(!bot?.botToken||!bot?.chatId) return false;
    const blob=await (await fetch(dataUrl)).blob();
    const fd=new FormData();
    fd.append('chat_id', bot.chatId);
    if(caption) fd.append('caption', String(caption).slice(0,1024));
    fd.append('photo', blob, 'report.png');
    const res=await fetch(`https://api.telegram.org/bot${bot.botToken}/sendPhoto`, { method:'POST', body:fd });
    return res.ok;
  }catch(e){ return false; }
}

async function shareOrDownload(dataUrl, filename, caption){
  let telegramOk=false;
  ensureV2State();
  if(state.telegram && state.telegram.autoSend && getActiveTelegramBot()){
    telegramOk = await sendTelegramPhoto(dataUrl, caption||filename||'تقرير');
  }
  const doneMsg = telegramOk ? '🖨️ تم إنشاء التقرير وإرساله لبوت Telegram 🟢' : '🖨️ تم إنشاء التقرير';
  try{
    const blob=await (await fetch(dataUrl)).blob();
    const file=new File([blob],(filename||'report')+'.png',{type:'image/png'});
    if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[file]}))){
      try{ await navigator.share({title:filename||'تقرير', files:[file]}); toast(doneMsg); return; }catch(e){}
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=(filename||'report')+'.png'; a.target='_blank'; a.rel='noopener'; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); },3000);
    toast(doneMsg);
  }catch(e){
    try{ window.open(dataUrl,'_blank','noopener'); toast('🖨️ تم فتح التقرير كصورة'); }
    catch(_){ toast('تعذر إنشاء التقرير', true); }
  }
}

/* Wraps text to fit a given canvas column width, returns an array of lines (max 4). */
function wrapCanvasText(ctx, text, maxWidth){
  const str=String(text??'').trim();
  if(!str) return ['—'];
  const words=str.split(/\s+/);
  const lines=[]; let line='';
  words.forEach(w=>{
    const test=line?line+' '+w:w;
    if(ctx.measureText(test).width>maxWidth && line){ lines.push(line); line=w; }
    else line=test;
  });
  if(line) lines.push(line);
  return lines.slice(0,4);
}

/* يضمن تحميل خطوط Cairo/Tajawal فعليًا قبل الرسم على الـ canvas، حتى لا يظهر التقرير بخط بديل غير واضح أو بدون النص العربي. */
async function ensureReportFontsReady(){
  try{
    const weights=['500','600','700','800','900'];
    const sizes=[12,13,14,15,16,17,18,30,38];
    const jobs=[];
    sizes.forEach(sz=>{
      weights.forEach(w=>{
        jobs.push(document.fonts.load(`${w} ${sz}px Cairo`));
        jobs.push(document.fonts.load(`${w} ${sz}px Tajawal`));
      });
      jobs.push(document.fonts.load(`bold ${sz}px Cairo`));
      jobs.push(document.fonts.load(`bold ${sz}px Tajawal`));
      jobs.push(document.fonts.load(`${sz}px Cairo`));
      jobs.push(document.fonts.load(`${sz}px Tajawal`));
    });
    await Promise.all(jobs);
    if(document.fonts.ready) await document.fonts.ready;
  }catch(e){ /* في حال فشل تحميل الخطوط، نكمل الرسم بأفضل خط متاح بدل تعليق الطباعة */ }
}

/* Clean, well-formatted weekly leave calendar report (name column on the right, dates flowing right-to-left). */
async function renderLeaveCalendarReport(records){
  await ensureReportFontsReady();
  const W=1400, labelW=260, gridW=W-labelW, cw=gridW/14;
  const bannerH=150, bandH=64, rowH=112;
  const dates=records.flatMap(r=>(r.selectedDays||[]).map(x=>typeof x==='string'?x:x.date)).filter(Boolean).sort();
  const base=weekSaturday(dates[0]||localISO(new Date()));
  const win=Array.from({length:14},(_,i)=>{ const d=new Date(base); d.setDate(base.getDate()+i); return { date: localISO(d), day: LEAVE_DAYS[i%7] }; });

  const gridTop=bannerH;
  const totalH=gridTop+bandH+Math.max(1,records.length)*rowH+46;
  const dpr=Math.min(window.devicePixelRatio||1,3);
  const c=document.createElement('canvas');
  c.width=Math.round(W*dpr); c.height=Math.round(totalH*dpr);
  c.style.width=W+'px'; c.style.height=totalH+'px';
  const ctx=c.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.direction='rtl'; ctx.textAlign='center';

  ctx.fillStyle='#F1F4F7'; ctx.fillRect(0,0,W,totalH);
  ctx.fillStyle='#16222D'; ctx.fillRect(0,0,W,bannerH);
  ctx.fillStyle='#FF8A4C'; ctx.font='bold 15px Tajawal, Arial';
  ctx.fillText('SAUDI MARKET • WAREHOUSE OPERATIONS', W/2, 34);
  ctx.fillStyle='#FFFFFF'; ctx.font='bold 38px Cairo, Arial';
  ctx.fillText('🗓️ تقرير إجازات العمال', W/2, 82);
  ctx.fillStyle='#C7D3DB'; ctx.font='17px Tajawal, Arial';
  ctx.fillText(`تاريخ الإصدار: ${new Date().toLocaleDateString('ar-EG')}  •  إجمالي العمال: ${records.length}`, W/2, 114);
  ctx.fillStyle='#8FA3AE'; ctx.font='13px Tajawal, Arial';
  ctx.fillText('الفترة المعروضة: الأسبوع الحالي + الأسبوع القادم', W/2, 136);

  ctx.fillStyle='#EEF3F6'; ctx.fillRect(0,gridTop,W,bandH);
  ctx.fillStyle='#FCEBDD'; ctx.fillRect(W-labelW,gridTop,labelW,bandH);
  ctx.strokeStyle='#D8E0E6'; ctx.lineWidth=1; ctx.strokeRect(0,gridTop,W,bandH);
  ctx.fillStyle='#16222D'; ctx.font='bold 17px Cairo, Arial';
  ctx.fillText('العامل', W-labelW/2, gridTop+30);
  ctx.fillStyle='#5C7080'; ctx.font='12px Tajawal, Arial';
  ctx.fillText('الكود / النوع', W-labelW/2, gridTop+50);

  win.forEach((x,i)=>{
    const cx=(W-labelW)-i*cw-cw/2;
    ctx.fillStyle='#16222D'; ctx.font='bold 15px Cairo, Arial';
    ctx.fillText(x.day, cx, gridTop+27);
    ctx.fillStyle='#5C7080'; ctx.font='12px Tajawal, Arial';
    ctx.fillText(x.date.split('-').slice(1).reverse().join('/'), cx, gridTop+48);
  });

  records.forEach((r,ri)=>{
    const y=gridTop+bandH+ri*rowH;
    ctx.fillStyle= ri%2? '#FBFCFD':'#F3F6F8';
    ctx.fillRect(0,y,W,rowH);
    ctx.fillStyle='#FFF7F0';
    ctx.fillRect(W-labelW,y,labelW,rowH);

    ctx.fillStyle='#16222D'; ctx.font='bold 18px Cairo, Arial';
    ctx.fillText(r.name||'', W-labelW/2, y+42);
    ctx.fillStyle='#5C7080'; ctx.font='13px Tajawal, Arial';
    ctx.fillText(r.code||'', W-labelW/2, y+65);
    ctx.fillStyle='#B8460A'; ctx.font='bold 12px Tajawal, Arial';
    ctx.fillText(r.type==='annual'?'سنوي':r.type==='sick'?'مرضي':'بدل رسمي', W-labelW/2, y+87);

    const selected=new Set((r.selectedDays||[]).map(x=>typeof x==='string'?x:x.date));
    win.forEach((x,i)=>{
      const cx=(W-labelW)-i*cw-cw/2;
      if(selected.has(x.date)){
        ctx.fillStyle='#D8F5E4'; ctx.fillRect(cx-cw/2+6, y+14, cw-12, rowH-28);
        ctx.strokeStyle='#8FDCB2'; ctx.strokeRect(cx-cw/2+6, y+14, cw-12, rowH-28);
        ctx.fillStyle='#168A4D'; ctx.font='bold 15px Cairo, Arial';
        ctx.fillText('إجازة', cx, y+rowH/2+6);
      }else{
        ctx.fillStyle='#B7C2C9'; ctx.font='16px Arial';
        ctx.fillText('—', cx, y+rowH/2+6);
      }
    });
  });

  ctx.strokeStyle='#E3E9EE'; ctx.lineWidth=1;
  const gridBottom=gridTop+bandH+records.length*rowH;
  for(let i=0;i<=14;i++){ const x=i*cw; ctx.beginPath(); ctx.moveTo(x,gridTop); ctx.lineTo(x,gridBottom); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(W-labelW,gridTop); ctx.lineTo(W-labelW,gridBottom); ctx.stroke();
  for(let r=0;r<=records.length;r++){ const y=gridTop+bandH+r*rowH; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  ctx.strokeRect(0,gridTop,W,bandH+records.length*rowH);

  ctx.fillStyle='#93A3AF'; ctx.font='12px Tajawal, Arial';
  ctx.fillText('تم إنشاء هذا التقرير تلقائيًا من تطبيق Saudi Market Warehouse Operations', W/2, totalH-16);

  const data=c.toDataURL('image/png');
  return shareOrDownload(data,'تقرير-إجازات-العمال','🗓️ تقرير إجازات العمال');
}

/* Generic clean tabular report used by shift-changes, seasonal, and warehouse reports (headers in RTL order, right = first). */
async function canvasReport(title, headers, rows, filename){
  await ensureReportFontsReady();
  const W=1240, bannerH=140, colHeadH=54, lineH=24, cellPadY=16, minRowH=56;
  const cols=headers.length;
  const colW=W/cols;
  const measure=document.createElement('canvas').getContext('2d');
  measure.font='15px Tajawal, Arial';
  const rowLines=rows.map(r=>headers.map((_,ci)=>wrapCanvasText(measure, r[ci], colW-28)));
  const rowHeights=rowLines.map(lines=>Math.max(minRowH, Math.max(...lines.map(l=>l.length))*lineH+cellPadY*2));
  const gridTop=bannerH+colHeadH;
  const totalH=gridTop+rowHeights.reduce((a,b)=>a+b,0)+40;

  const dpr=Math.min(window.devicePixelRatio||1,3);
  const c=document.createElement('canvas');
  c.width=Math.round(W*dpr); c.height=Math.round(totalH*dpr);
  c.style.width=W+'px'; c.style.height=totalH+'px';
  const ctx=c.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.direction='rtl'; ctx.textAlign='center';

  ctx.fillStyle='#F1F4F7'; ctx.fillRect(0,0,W,totalH);
  ctx.fillStyle='#16222D'; ctx.fillRect(0,0,W,bannerH);
  ctx.fillStyle='#FF8A4C'; ctx.font='bold 14px Tajawal, Arial';
  ctx.fillText('SAUDI MARKET • WAREHOUSE OPERATIONS', W/2, 32);
  ctx.fillStyle='#FFFFFF'; ctx.font='bold 30px Cairo, Arial';
  ctx.fillText(title, W/2, 74);
  ctx.fillStyle='#C7D3DB'; ctx.font='15px Tajawal, Arial';
  ctx.fillText(`${new Date().toLocaleDateString('ar-EG')}  •  إجمالي السجلات: ${rows.length}`, W/2, 104);

  ctx.fillStyle='#EEF3F6'; ctx.fillRect(0,bannerH,W,colHeadH);
  ctx.strokeStyle='#7C8B96'; ctx.lineWidth=2; ctx.strokeRect(0,bannerH,W,colHeadH);
  ctx.fillStyle='#16222D'; ctx.font='bold 16px Cairo, Arial';
  headers.forEach((h,i)=>{ const cx=W-i*colW-colW/2; ctx.fillText(h, cx, bannerH+34); });

  let y=gridTop;
  rowLines.forEach((lines,ri)=>{
    const rh=rowHeights[ri];
    ctx.fillStyle= ri%2? '#FBFCFD':'#EDF1F4';
    ctx.fillRect(0,y,W,rh);
    lines.forEach((cellLines,ci)=>{
      const cx=W-ci*colW-colW/2;
      ctx.fillStyle='#16222D'; ctx.font='14px Tajawal, Arial';
      const blockH=cellLines.length*lineH;
      let ty=y+rh/2-blockH/2+lineH*0.72;
      cellLines.forEach(line=>{ ctx.fillText(line, cx, ty); ty+=lineH; });
    });
    y+=rh;
  });

  ctx.strokeStyle='#AEBAC3'; ctx.lineWidth=1.6;
  const gridBottom=gridTop+rowHeights.reduce((a,b)=>a+b,0);
  for(let i=0;i<=cols;i++){ const x=i*colW; ctx.beginPath(); ctx.moveTo(x,bannerH); ctx.lineTo(x,gridBottom); ctx.stroke(); }
  let ly=gridTop;
  rowHeights.forEach(rh=>{ ctx.beginPath(); ctx.moveTo(0,ly); ctx.lineTo(W,ly); ctx.stroke(); ly+=rh; });
  ctx.beginPath(); ctx.moveTo(0,ly); ctx.lineTo(W,ly); ctx.stroke();
  ctx.strokeStyle='#7C8B96'; ctx.lineWidth=2.2;
  ctx.strokeRect(0,bannerH,W,colHeadH+rowHeights.reduce((a,b)=>a+b,0));

  ctx.fillStyle='#93A3AF'; ctx.font='11.5px Tajawal, Arial';
  ctx.fillText('تم إنشاء هذا التقرير تلقائيًا من تطبيق Saudi Market Warehouse Operations', W/2, totalH-16);

  const data=c.toDataURL('image/png');
  return shareOrDownload(data, filename, title);
}

/* ================= زر "تصدير Excel" بجانب كل زر طباعة تقرير ================= */
/* يحسب عرض كل عمود حسب أطول محتوى فيه، حتى لا يتداخل النص العربي أو يُقطع. */
function autoFitExcelCols(aoa){
  const colCount = aoa.reduce((m,r)=>Math.max(m,r.length),0);
  const widths = new Array(colCount).fill(10);
  aoa.forEach(row=>{
    row.forEach((cell,i)=>{
      const len = String(cell??'').length;
      widths[i] = Math.max(widths[i], Math.min(48, len + 6));
    });
  });
  return widths.map(w=>({wch:w}));
}

/* يبني ملف Excel من صفوف بيانات + عناوين عربية، بضبط اتجاه الشيت RTL وعرض الأعمدة تلقائيًا. */
function exportRowsToExcel(sheetName, headers, rows, filename){
  if(!excelReady()) return;
  try{
    const aoa=[headers, ...rows.map(r=>r.map(v=>(v===undefined||v===null)?'':v))];
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=autoFitExcelCols(aoa);
    ws['!rows']=[{hpx:26}];
    /* محاذاة النصوص لليمين وخط أوضح لعناوين الأعمدة، إن كانت النسخة المستخدمة من المكتبة تدعم الأنماط. */
    try{
      const range=XLSX.utils.decode_range(ws['!ref']);
      for(let R=range.s.r; R<=range.e.r; R++){
        for(let C=range.s.c; C<=range.e.c; C++){
          const ref=XLSX.utils.encode_cell({r:R,c:C});
          if(!ws[ref]) continue;
          ws[ref].s = {
            alignment:{ horizontal:'right', vertical:'center', wrapText:true, readingOrder:2 },
            font: R===0 ? { name:'Arial', sz:12, bold:true } : { name:'Arial', sz:11 }
          };
        }
      }
    }catch(e){}
    const wb=XLSX.utils.book_new();
    wb.Workbook = wb.Workbook || {};
    wb.Workbook.Views = [{ RTL:true }];
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
    XLSX.writeFile(wb, filename, { cellStyles:true });
    toast('🟢 تم تصدير Excel بنجاح');
  }catch(e){ toast('🔴 تعذر تصدير Excel'+(e&&e.message?': '+e.message:'')); }
}

function filterShiftChangeWorkers(){
  const q=(document.getElementById('shiftChangeSearch')?.value||'').toLowerCase();
  document.querySelectorAll('.shift-change-worker').forEach(c=>{ c.style.display=(c.dataset.name.toLowerCase().includes(q)||c.dataset.code.toLowerCase().includes(q))?'block':'none'; });
}
function saveShiftChanges(){
  const active=state.workers.filter(w=>w.active);
  const batchId='SC-'+Date.now();
  const at=new Date().toLocaleString('ar-EG');
  let moved=0;
  active.forEach(w=>{
    const target=_shiftChangeSelections[w.id];
    if(!target||target===w.shiftId) return;
    const rec={ id:'SFT-'+Date.now()+'-'+Math.random().toString(36).slice(2,7), name:w.name, code:w.code, oldShift:w.shiftId, newShift:target, by:currentUser().name, at, batchId };
    state.shiftChanges.unshift(rec);
    w.shiftId=target;
    syncMark('shift_change', rec);
    moved++;
  });
  if(!moved){ toast('لا يوجد تغييرات محددة للتنفيذ'); return; }
  queueSave();
  toast(`✅ تم تغيير شفت ${moved} عامل بنجاح`);
  active.forEach(w=>{ _shiftChangeSelections[w.id]=w.shiftId; });
  renderApp();
}

function saveSeasonalAssignments(){
  const selects=[...document.querySelectorAll('.seasonalSelect')];
  const at=new Date().toLocaleString('ar-EG');
  let changed=0;
  selects.forEach(sel=>{
    const w=workerById(sel.dataset.worker); if(!w) return;
    const val=sel.value;
    if((w.seasonalCategory||'')===val) return;
    w.seasonalCategory=val;
    const idx=state.seasonalAssignments.findIndex(a=>a.workerId===w.id);
    if(val){
      const rec={ workerId:w.id, name:w.name, code:w.code, category:val, by:currentUser().name, at };
      if(idx>=0) state.seasonalAssignments[idx]=rec; else state.seasonalAssignments.unshift(rec);
      syncMark('seasonal_assign', rec);
    }else{
      /* غير موزع: يُحذف من قائمة التوزيع فلا يظهر في الشيت أو التقرير */
      if(idx>=0) state.seasonalAssignments.splice(idx,1);
      syncMark('seasonal_unassign', { workerId:w.id, name:w.name, code:w.code, by:currentUser().name, at });
    }
    changed++;
  });
  if(!changed){ toast('لا يوجد تغييرات لحفظها'); return; }
  queueSave();
  toast(`تم حفظ توزيع ${changed} عامل`);
  renderApp();
}

/* ================= EXCEL EXPORT / IMPORT (حل محل ربط Google Sheets) ================= */
function excelSafeObj(v){ return (v && typeof v==='object') ? JSON.stringify(v) : ''; }
function excelSafeArr(v){ return Array.isArray(v) ? JSON.stringify(v) : ''; }

/* يضبط عرض الأعمدة تلقائيًا حسب طول المحتوى، يجمّد صف العناوين، يخلي اتجاه الشيت RTL، وينسّق صف العناوين بخط غامق وخلفية لونية عشان يبقى واضح وسهل القراءة. */
function styleSheet(ws, rows){
  if(!ws || !ws['!ref']) return;
  const keys = rows && rows.length ? Object.keys(rows[0]) : [];
  if(!keys.length) return;
  ws['!cols'] = keys.map(k=>{
    let maxLen = String(k).length;
    rows.forEach(r=>{ const v=r[k]; const len = v==null? 0 : String(v).length; if(len>maxLen) maxLen=len; });
    return { wch: Math.min(Math.max(maxLen+3, 11), 45) };
  });
  ws['!rows'] = [{ hpt: 24 }];
  ws['!views'] = [{ rightToLeft:true, state:'frozen', ySplit:1, topLeftCell:'A2' }];
  try{
    const range = XLSX.utils.decode_range(ws['!ref']);
    for(let C=range.s.c; C<=range.e.c; C++){
      const addr = XLSX.utils.encode_cell({ r:0, c:C });
      if(ws[addr]){
        ws[addr].s = {
          font:{ bold:true, sz:12, color:{ rgb:'FFFFFF' } },
          fill:{ fgColor:{ rgb:'FF6A1A' } },
          alignment:{ horizontal:'center', vertical:'center' }
        };
      }
    }
  }catch(e){ /* التنسيق الشكلي اختياري، لو فشل نكمل تصدير البيانات عادي */ }
}

function buildExportWorkbook(){
  const wb = XLSX.utils.book_new();
  const addSheet=(name, rows)=>{
    const safeRows = rows && rows.length ? rows : [{}];
    const ws=XLSX.utils.json_to_sheet(safeRows);
    styleSheet(ws, safeRows);
    XLSX.utils.book_append_sheet(wb, ws, name);
  };

  addSheet('Workers', state.workers.map(w=>({
    id:w.id, name:w.name, code:w.code, shiftId:w.shiftId||'', shiftName: shiftById(w.shiftId)?.name||'', deptKey:w.deptKey||'',
    active: !!w.active, present: !!w.present, annualTotal: w.annualTotal??'', seasonalCategory: w.seasonalCategory||''
  })));

  // ملاحظة: username/password بيتصدروا فاضيين قصدًا لحماية بيانات الدخول. الاستيراد بيحافظ على القيم القديمة تلقائيًا لو الخانة فاضية،
  // ولو حبيت تغيّر يوزر/باسورد حد موجود اكتب القيمة الجديدة في الخانة، ولو بتضيف مستخدم جديد لازم تملأ الخانتين.
  addSheet('Users', state.users.map(u=>({
    id:u.id, name:u.name, username:'', password:'', role:u.role, shiftId:u.shiftId||'', active: !!u.active, temporary: !!u.temporary
  })));

  addSheet('Shifts', state.shifts.map(s=>({
    id:s.id, name:s.name, startTime:s.startTime, endTime:s.endTime, icon:s.icon||'', supervisorId:s.supervisorId||''
  })));

  addSheet('Reports', state.reports.map(r=>({
    id:r.id, date:r.date, dateISO:r.dateISO||'', shiftId:r.shiftId||'', shiftName:r.shiftName, shiftTimes:r.shiftTimes||'', supervisor:r.supervisor, workersCount:r.workersCount,
    truckCount:(r.ops&&r.ops.truckCount)||'', status:(r.ops&&r.ops.status)||'', notes:(r.ops&&r.ops.notes)||'', issues:(r.ops&&r.ops.issues)||'',
    telegramSent: !!r.telegramSent, attendanceJSON: excelSafeObj(r.attendance), departmentsJSON: excelSafeObj(r.departments)
  })));

  addSheet('Leaves', state.leaves.map(l=>({
    id:l.id, workerId:l.workerId, name:l.name, code:l.code, type:l.type, days:l.days, start:l.start, end:l.end||'', returnDate:l.returnDate||'',
    balanceBefore:l.balanceBefore??'', balanceAfter:l.balanceAfter??'', createdBy:l.createdBy, createdAt:l.createdAt, batchId:l.batchId||'',
    selectedDaysJSON: excelSafeArr(l.selectedDays)
  })));

  addSheet('ShiftChanges', state.shiftChanges.map(x=>({
    id:x.id, name:x.name, code:x.code, oldShift:x.oldShift||'', newShift:x.newShift||'', by:x.by||'', at:x.at||'', batchId:x.batchId||''
  })));

  addSheet('SeasonalAssignments', state.seasonalAssignments.map(a=>({
    workerId:a.workerId, name:a.name||'', code:a.code||'', category:a.category||'', by:a.by||'', at:a.at||''
  })));

  addSheet('WarehouseTasks', (state.warehouseTasks||[]).map(t=>({
    id:t.id, notes:t.notes||'', status:t.status||'pending', targetShiftId:t.targetShiftId||'', createdBy:t.createdBy||'', createdAt:t.createdAt||'',
    resolvedBy:t.resolvedBy||'', resolvedAt:t.resolvedAt||'', resolutionNotes:t.resolutionNotes||'', failureReason:t.failureReason||''
  })));

  return wb;
}

async function handleExcelImportFile(fileInput){
  const file=fileInput.files && fileInput.files[0];
  if(!file) return;
  if(!excelReady()){ fileInput.value=''; return; }
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const rowsOf=(name)=>{ const ws=wb.Sheets[name]; return ws? XLSX.utils.sheet_to_json(ws,{defval:''}) : null; };
    const toBool=v=> v===true||v==='TRUE'||v==='true'||v===1||v==='1';
    const toObj=(v,fb)=>{ if(!v) return fb; try{ const p=JSON.parse(v); return (p&&typeof p==='object')?p:fb; }catch(e){ return fb; } };
    const toArr=v=>{ if(!v) return []; try{ const p=JSON.parse(v); return Array.isArray(p)?p:[]; }catch(e){ return []; } };
    let sheetsFound=0;

    const workersRows=rowsOf('Workers');
    if(workersRows){ sheetsFound++; state.workers=workersRows.filter(r=>r.id).map(r=>({ id:String(r.id), name:String(r.name||''), code:String(r.code||''), shiftId:String(r.shiftId||''), deptKey:String(r.deptKey||''), active:toBool(r.active), present:toBool(r.present), annualTotal:r.annualTotal===''?undefined:Number(r.annualTotal), seasonalCategory:r.seasonalCategory||'' })); }

    const usersRows=rowsOf('Users');
    if(usersRows){
      sheetsFound++;
      const existingUsersById={}; (state.users||[]).forEach(u=>{ existingUsersById[u.id]=u; });
      // لو خانة username/password فاضية في الشيت (الوضع الافتراضي في التصدير)، بنحافظ على القيمة القديمة بدل ما نمسحها.
      state.users = await Promise.all(usersRows.filter(r=>r.id).map(async r=>{
        const existing=existingUsersById[String(r.id)];
        const username = (r.username && String(r.username).trim()) ? String(r.username).trim() : (existing? existing.username : '');
        const newPlainPassword = (r.password && String(r.password).trim()) ? String(r.password).trim() : '';
        const u = { id:String(r.id), name:String(r.name||''), username, role:String(r.role||'supervisor'), shiftId:r.shiftId?String(r.shiftId):null, active:toBool(r.active), temporary:toBool(r.temporary) };
        if (newPlainPassword) {
          await setUserPassword(u, newPlainPassword); // كلمة سر جديدة اتكتبت في الشيت -> يتعمل لها hash
        } else if (existing) {
          u.passwordHash = existing.passwordHash;
          u.passwordSalt = existing.passwordSalt;
        }
        return u;
      }));
    }

    const shiftsRows=rowsOf('Shifts');
    if(shiftsRows){ sheetsFound++; state.shifts=shiftsRows.filter(r=>r.id).map(r=>({ id:String(r.id), name:String(r.name||''), startTime:String(r.startTime||''), endTime:String(r.endTime||''), icon:r.icon||'', supervisorId:r.supervisorId||'' })); }

    const reportsRows=rowsOf('Reports');
    if(reportsRows){ sheetsFound++; state.reports=reportsRows.filter(r=>r.id).map(r=>({ id:String(r.id), date:String(r.date||''), dateISO:r.dateISO||'', shiftId:r.shiftId||'', shiftName:String(r.shiftName||''), shiftTimes:r.shiftTimes||'', supervisor:String(r.supervisor||''), workersCount:Number(r.workersCount)||0, attendance:toObj(r.attendanceJSON,{}), departments:toObj(r.departmentsJSON,{}), ops:{ truckCount:r.truckCount||'', status:r.status||'', notes:r.notes||'', issues:r.issues||'' }, telegramSent:toBool(r.telegramSent) })); }

    const leavesRows=rowsOf('Leaves');
    if(leavesRows){ sheetsFound++; state.leaves=leavesRows.filter(r=>r.id).map(r=>({ id:String(r.id), workerId:String(r.workerId||''), name:String(r.name||''), code:String(r.code||''), type:String(r.type||''), days:Number(r.days)||0, start:String(r.start||''), end:r.end||'', returnDate:r.returnDate||'', balanceBefore:r.balanceBefore===''?undefined:Number(r.balanceBefore), balanceAfter:r.balanceAfter===''?undefined:Number(r.balanceAfter), createdBy:String(r.createdBy||''), createdAt:String(r.createdAt||''), batchId:r.batchId||'', selectedDays:toArr(r.selectedDaysJSON) })); }

    const shiftChangesRows=rowsOf('ShiftChanges');
    if(shiftChangesRows){ sheetsFound++; state.shiftChanges=shiftChangesRows.filter(r=>r.id).map(r=>({ id:String(r.id), name:String(r.name||''), code:String(r.code||''), oldShift:r.oldShift||'', newShift:r.newShift||'', by:r.by||'', at:r.at||'', batchId:r.batchId||'' })); }

    const seasonalRows=rowsOf('SeasonalAssignments');
    if(seasonalRows){ sheetsFound++; state.seasonalAssignments=seasonalRows.filter(r=>r.workerId).map(r=>({ workerId:String(r.workerId), name:r.name||'', code:r.code||'', category:r.category||'', by:r.by||'', at:r.at||'' })); }

    const tasksRows=rowsOf('WarehouseTasks');
    if(tasksRows){
      sheetsFound++;
      const keepMedia={}; (state.warehouseTasks||[]).forEach(t=>{ keepMedia[t.id]={photo:t.photo||'',afterPhoto:t.afterPhoto||''}; });
      state.warehouseTasks=tasksRows.filter(r=>r.id).map(r=>({ id:String(r.id), notes:String(r.notes||''), status:String(r.status||'pending'), targetShiftId:r.targetShiftId||'', createdBy:r.createdBy||'', createdAt:r.createdAt||'', resolvedBy:r.resolvedBy||'', resolvedAt:r.resolvedAt||'', resolutionNotes:r.resolutionNotes||'', failureReason:r.failureReason||'', photo:(keepMedia[r.id]&&keepMedia[r.id].photo)||'', afterPhoto:(keepMedia[r.id]&&keepMedia[r.id].afterPhoto)||'' }));
    }

    if(!sheetsFound){ toast('🔴 لم يتم العثور على أي شيت مطابق داخل الملف'); fileInput.value=''; return; }

    ensureV2State();
    queueSave();
    await saveState();
    fileInput.value='';
    toast('🟢 تم استيراد بيانات Excel بنجاح');
    renderApp();
  }catch(e){
    toast('🔴 تعذر قراءة ملف Excel'+(e&&e.message?': '+e.message:''));
    fileInput.value='';
  }
}

function handleSaveStatus(){
  const editId=window._statusEditId||'';
  const workerId=document.getElementById('statusWorker').value;
  const w=workerById(workerId); if(!w){toast('اختر عاملًا');return;}
  const date=document.getElementById('statusDate').value; if(!date){toast('حدد التاريخ');return;}
  const type=document.getElementById('statusType').value;
  const info=statusTypeInfo(type);
  const reason=document.getElementById('statusReason').value.trim();
  let startTime='',endTime='',halfPart='',durationMinutes=0;
  if(info.mode==='time'){startTime=document.getElementById('statusTime1').value||'';if(!startTime){toast('حدد الوقت');return;}}
  if(info.mode==='range'){
    startTime=document.getElementById('statusTime1').value||'';endTime=document.getElementById('statusTime2').value||'';
    if(!startTime||!endTime){toast('حدد وقت الخروج والعودة');return;}
    const [h1,m1]=startTime.split(':').map(Number),[h2,m2]=endTime.split(':').map(Number);
    durationMinutes=Math.max(0,(h2*60+m2)-(h1*60+m1));

  if(editId){
    const rec=state.workerStatuses.find(x=>x.id===editId); if(!rec){toast('تعذر إيجاد السجل');return;}
    if(!canEditStatusRecord(rec)){toast('غير مصرح لك بتعديل هذه الحالة');return;}

    if(type!=='sick')rec.sickCounted=null; else if(rec.sickCounted===null||rec.sickCounted===undefined)rec.sickCounted=false;
    auditAdd('status_update',{recordId:rec.id,workerId:rec.workerId,typeBefore:before.type,typeAfter:rec.type});
    syncMark('status_update',rec);
    queueSave();closeModal();toast('تم تحديث الحالة');renderApp();return;

/* -------- أيام العمل الفعلية (بدل افتراض كل أيام الشهر) -------- */
const AR_MONTH_NAMES={'يناير':1,'فبراير':2,'مارس':3,'أبريل':4,'إبريل':4,'مايو':5,'يونيو':6,'يوليو':7,'أغسطس':8,'سبتمبر':9,'أكتوبر':10,'نوفمبر':11,'ديسمبر':12};
// بيرجع تاريخ التقرير بصيغة ISO سواء كان محفوظ فيه dateISO (تقارير جديدة) أو محتاج تحويل من التسمية العربية (تقارير قديمة قبل هذا التحديث)
function reportDateISO(r){
  if(r.dateISO) return r.dateISO;
  const m=String(r.date||'').match(/(\d{1,2})\s+([^\d\s]+)\s+(\d{4})/);
  if(!m) return null;
  const month=AR_MONTH_NAMES[m[2]];
  if(!month) return null;
  return `${m[3]}-${String(month).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
}
// بيحسب عدد أيام العمل الفعلية للعامل في الفترة = عدد الأيام اللي فعلاً اتعمل فيها كشف حضور تشغيلي شامله (سواء ظهر حاضر أو غايب فيه)
// وده بيستبعد تلقائيًا أي يوم محدش اشتغل فيه أصلاً (زي جمعة عادية معملهاش كشف)، وبيحسب أي يوم استثنائي فعلاً حصل فيه شغل (زي جمعة اشتغل فيها العامل)
function workerWorkedDays(workerId,from,to){
  const days=new Set();
  state.reports.forEach(r=>{
    if(!r.attendance||!(workerId in r.attendance)) return;
    const iso=reportDateISO(r);
    if(!iso||iso<from||iso>to) return;
    days.add(iso);
  });
  return days.size;
}
/* -------- حساب التقييم -------- */
function evalPeriodRange(monthStr){
  const parts=(monthStr||localISO(new Date()).slice(0,7)).split('-').map(Number);
  const y=parts[0],m=parts[1];
  const from=`${y}-${String(m).padStart(2,'0')}-01`;
  const lastDay=new Date(y,m,0).getDate();
  const to=`${y}-${String(m).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  return {from,to,days:lastDay};
}
function computeWorkerEval(workerId,monthStr){
  const {from,to,days}=evalPeriodRange(monthStr);
  const recs=state.workerStatuses.filter(r=>r.workerId===workerId&&r.date>=from&&r.date<=to);
  const approved=recs.filter(r=>r.approvalStatus==='approved');
  const c={absentFull:0,absentHalf:0,lateEntry2h:0,earlyLeave2h:0,mission:0,sick:0,sickCounted:0,sickNotCounted:0,emergency:0,penaltyHalf:0,penaltyFull:0};
  approved.forEach(r=>{
    if(c[r.type]!==undefined)c[r.type]++;
    if(r.type==='sick'){ r.sickCounted?c.sickCounted++:c.sickNotCounted++; }
  });
  const rejectedLateHours=recs.filter(r=>r.type==='lateEntry2h'&&r.approvalStatus==='rejected').length*2;
  const rejectedEarlyHours=recs.filter(r=>r.type==='earlyLeave2h'&&r.approvalStatus==='rejected').length*2;
  const d=state.evalSettings.deductions;
  const deduct=c.absentFull*d.absentFull+c.absentHalf*d.absentHalf+c.penaltyHalf*d.penaltyHalf+c.penaltyFull*d.penaltyFull+c.sickCounted*d.sick+rejectedLateHours*d.lateUnapprovedPerHour+rejectedEarlyHours*d.earlyLeaveUnapprovedPerHour;
  const score=Math.max(0,Math.min(100,Math.round(100-deduct)));
  const absentEquivDays=c.absentFull+c.absentHalf*0.5;
  const workedDays=workerWorkedDays(workerId,from,to);
  const attendancePct=workedDays?Math.max(0,Math.round((1-absentEquivDays/workedDays)*100)):100;
  return {counts:c,rejectedLateHours,rejectedEarlyHours,score,attendancePct,periodDays:days,workedDays,from,to};
}
function ratingForScore(s){
  if(s>=90)return {label:'🟢 ممتاز',cls:'success'};
  if(s>=75)return {label:'🔵 جيد جدًا',cls:'info'};
  if(s>=60)return {label:'🟡 جيد',cls:'warning'};
  if(s>=40)return {label:'🟠 يحتاج تحسين',cls:'warning'};
  return {label:'🔴 ضعيف',cls:'danger'};
}

/* -------- شاشة التقييم -------- */
let _evalMonth=localISO(new Date()).slice(0,7);
let _evalDetailWorkerId='';
function setEvalMonth(v){_evalMonth=v;renderApp();}
function openWorkerEvalDetailScreen(workerId){_evalDetailWorkerId=workerId;setScreen('workerEval');}
function backToEvalList(){_evalDetailWorkerId='';renderApp();}
function renderEvalScreen(){
  if(_evalDetailWorkerId)return renderEvalDetail(_evalDetailWorkerId);
  const scope=isAdmin()?state.workers.filter(w=>w.active):state.workers.filter(w=>w.active&&w.shiftId===currentUser().shiftId);
  return `<div class="px" style="padding-top:12px">
    <div class="row"><h3 style="margin:0">📊 تقييم وانضباط العمال</h3>${isAdmin()?`<div style="display:flex;gap:6px"><button class="btn btn-secondary btn-sm" onclick="openEvalSettingsModal()">⚙️ الإعدادات</button><button class="btn btn-secondary btn-sm" onclick="setScreen('auditLog')">🔐 السجل</button></div>`:''}</div>
    <input class="input" type="month" style="margin-top:10px" value="${_evalMonth}" onchange="setEvalMonth(this.value)">
    <div style="margin-top:12px">
      ${scope.length?scope.map(w=>{const ev=computeWorkerEval(w.id,_evalMonth);const r=ratingForScore(ev.score);
        return `<div class="card" style="cursor:pointer" onclick="openWorkerEvalDetailScreen('${w.id}')">
          <div class="row"><b>${escapeHtml(w.name)}</b><span class="badge ${r.cls}">${r.label}</span></div>
          <div class="muted" style="margin-top:2px">${escapeHtml(w.code)} • ${escapeHtml(shiftById(w.shiftId)?.name||'—')}</div>
          <div class="row" style="margin-top:8px"><span>الدرجة: <b>${ev.score}/100</b></span><span>الحضور: <b>${ev.attendancePct}%</b></span></div>
        </div>`;}).join(''):'<div class="card">لا يوجد عمال ضمن هذا النطاق.</div>'}
    </div>

}
function renderEvalDetail(workerId){

  if(!w)return `<div class="px" style="padding-top:12px"><div class="card">العامل غير موجود.</div><button class="btn btn-secondary" onclick="backToEvalList()">⬅️ رجوع</button></div>`;
  const ev=computeWorkerEval(workerId,_evalMonth);const r=ratingForScore(ev.score);const c=ev.counts;
  const noteVal=state.evalNotes[workerId]||'';
  const canNote=isAdmin()||currentUser().shiftId===w.shiftId;
  return `<div class="px" style="padding-top:12px">
    <button class="btn btn-secondary btn-sm" onclick="backToEvalList()">⬅️ رجوع للقائمة</button>
    <div class="card" style="margin-top:10px;text-align:center">
      <b style="font-size:17px">${escapeHtml(w.name)}</b><div class="muted">${escapeHtml(w.code)} • ${escapeHtml(shiftById(w.shiftId)?.name||'—')}</div>
      <div style="font-size:34px;font-weight:900;margin-top:8px">${ev.score}<span style="font-size:15px">/100</span></div>
      <span class="badge ${r.cls}">${r.label}</span>
    </div>
    <input class="input" type="month" value="${_evalMonth}" onchange="setEvalMonth(this.value)">
    <div class="card" style="margin-top:10px">
      <div class="grid2" style="row-gap:10px">
        <div>نسبة الحضور: <b>${ev.attendancePct}%</b></div>
        <div>أيام العمل الفعلية بالشهر: <b>${ev.workedDays}</b></div>
        <div>غياب كامل: <b>${c.absentFull}</b></div>
        <div>غياب نصف يوم: <b>${c.absentHalf}</b></div>
        <div>مرات إذن التأخير: <b>${c.lateEntry2h}</b></div>
        <div>أذونات انصراف ساعتين: <b>${c.earlyLeave2h}</b></div>
        <div>مأموريات: <b>${c.mission}</b></div>
        <div>حالات مرض: <b>${c.sick}</b></div>
        <div>مرض محتسب: <b>${c.sickCounted}</b></div>
        <div>مرض غير محتسب: <b>${c.sickNotCounted}</b></div>
        <div>ظروف طارئة: <b>${c.emergency}</b></div>
        <div>جزاءات نصف يوم: <b>${c.penaltyHalf}</b></div>
        <div>جزاءات يوم كامل: <b>${c.penaltyFull}</b></div>
        <div>تأخير بدون اعتماد (ساعات): <b>${ev.rejectedLateHours}</b></div>
        <div>انصراف بدون اعتماد (ساعات): <b>${ev.rejectedEarlyHours}</b></div>
      </div>
    </div>
    <div class="card">
      <b>📋 حالات الشهر المؤثرة في التقييم (${ev.from} → ${ev.to})</b>
      <div style="margin-top:8px">
        ${(() => {
          const recs = state.workerStatuses.filter(r => r.workerId === w.id && r.date >= ev.from && r.date <= ev.to)
            .slice().sort((a,b) => String(b.date+b.createdAt).localeCompare(a.date+a.createdAt));
          if (!recs.length) return '<div class="muted">لا توجد حالات مسجلة لهذا العامل في هذا الشهر.</div>';
          return recs.map(r => `<div class="card" style="margin-top:8px">
            <div class="row"><span style="font-weight:700">${statusLabel(r.type)}</span>${statusApprovalBadge(r)}</div>
            <div class="muted" style="margin-top:2px">${r.date}</div>
            ${statusDetailLine(r) ? `<div class="muted" style="margin-top:2px">${escapeHtml(statusDetailLine(r))}</div>` : ''}
            ${r.reason ? `<div class="muted" style="margin-top:2px">${escapeHtml(r.reason)}</div>` : ''}
            ${r.type==='sick' ? `<div style="margin-top:6px"><span class="badge ${r.sickCounted?'warning':'info'}">${r.sickCounted?'🤒 محتسب في التقييم':'🤒 غير محتسب في التقييم'}</span></div>` : ''}
            <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
              ${canEditStatusRecord(r) ? `<button class="btn btn-secondary btn-sm" onclick="openAddStatusModal('${r.workerId}','${r.id}')">✏️ تعديل</button>` : ''}
              ${canDeleteStatusRecord(r) ? `<button class="btn btn-danger btn-sm" onclick="deleteStatus('${r.id}')">🗑️ حذف</button>` : ''}

        })()}
      </div>
    </div>
    <div class="card">
      <b>📝 ملاحظات المشرف</b>
      <textarea class="input" id="evalNoteInput" rows="3" ${canNote?'':'disabled'}>${escapeHtml(noteVal)}</textarea>
      ${canNote?`<button class="btn btn-secondary btn-sm" style="margin-top:8px" onclick="saveEvalNote('${w.id}')">💾 حفظ الملاحظة</button>`:''}
    </div>
    <button class="btn btn-secondary btn-sm" onclick="openAddStatusModal('${w.id}')">➕ إضافة حالة لهذا العامل</button>
  </div>`;
}
function saveEvalNote(workerId){
  const v=document.getElementById('evalNoteInput').value.trim();
  state.evalNotes[workerId]=v;
  auditAdd('eval_note_update',{workerId});
  queueSave();toast('تم حفظ الملاحظة');
}
function openEvalSettingsModal(){
  if(!isAdmin())return;
  const d=state.evalSettings.deductions;
  openModal(`<div class="modal-header"><h3 style="margin:0">⚙️ إعدادات نقاط التقييم</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="muted" style="margin-bottom:8px">حدد عدد النقاط المخصومة من 100 لكل نوع مخالفة.</div>
    ${Object.keys(d).map(k=>`<label class="muted" style="display:block;margin-top:8px">${evalSettingLabel(k)}</label><input class="input" type="number" min="0" id="evs_${k}" value="${d[k]}">`).join('')}
    <button class="btn btn-primary" style="margin-top:14px" onclick="saveEvalSettings()">💾 حفظ الإعدادات</button>`);
}
function evalSettingLabel(k){return {absentFull:'غياب يوم كامل',absentHalf:'غياب نصف يوم',penaltyHalf:'جزاء نصف يوم',penaltyFull:'جزاء يوم كامل',lateUnapprovedPerHour:'تأخير بدون اعتماد (لكل ساعة)',earlyLeaveUnapprovedPerHour:'انصراف بدون اعتماد (لكل ساعة)',sick:'مرض محتسب'}[k]||k;}
function saveEvalSettings(){
  const d=state.evalSettings.deductions;
  Object.keys(d).forEach(k=>{const el=document.getElementById('evs_'+k);const v=Number(el&&el.value);if(Number.isFinite(v)&&v>=0)d[k]=v;});
  auditAdd('eval_settings_update',{});
  queueSave();closeModal();toast('تم حفظ إعدادات التقييم');renderApp();
}

/* -------- شاشة ترتيب العمال -------- */
let _rankMonth=localISO(new Date()).slice(0,7);
let _rankShift='';
let _rankQuery='';
function setRankFilter(k,v){ if(k==='month')_rankMonth=v; if(k==='shiftId')_rankShift=v; if(k==='q')_rankQuery=v; renderApp(); }
function computeRanking(){
  let scope=isAdmin()?state.workers.filter(w=>w.active):state.workers.filter(w=>w.active&&w.shiftId===currentUser().shiftId);
  if(_rankShift)scope=scope.filter(w=>w.shiftId===_rankShift);
  if(_rankQuery){const q=_rankQuery.toLowerCase();scope=scope.filter(w=>w.name.toLowerCase().includes(q)||w.code.toLowerCase().includes(q));}
  const list=scope.map(w=>({w,ev:computeWorkerEval(w.id,_rankMonth)}));
  list.sort((a,b)=>b.ev.score-a.ev.score);
  return list;
}
function renderRankingScreen(){
  const list=computeRanking();
  return `<div class="px" style="padding-top:12px">
    <div class="row"><h3 style="margin:0">🏆 ترتيب العمال</h3><button class="btn btn-secondary btn-sm" onclick="printRankingReport()">🖨️ تقرير</button></div>
    <input class="input" type="month" style="margin-top:10px" value="${_rankMonth}" onchange="setRankFilter('month',this.value)">
    ${isAdmin()?`<select class="input" style="margin-top:8px" onchange="setRankFilter('shiftId',this.value)"><option value="">كل الشفتات</option>${state.shifts.map(s=>`<option value="${s.id}" ${_rankShift===s.id?'selected':''}>${s.icon||''} ${escapeHtml(s.name)}</option>`).join('')}</select>`:''}
    <input class="input" style="margin-top:8px" placeholder="🔍 بحث بالاسم أو الكود" value="${escapeHtml(_rankQuery)}" oninput="setRankFilter('q',this.value)">
    <div style="margin-top:12px">
      ${list.length?list.map((x,i)=>{const r=ratingForScore(x.ev.score);return `<div class="card"><div class="row"><b>#${i+1} ${escapeHtml(x.w.name)}</b><span class="badge ${r.cls}">${r.label}</span></div>
        <div class="muted" style="margin-top:2px">${escapeHtml(x.w.code)} • ${escapeHtml(shiftById(x.w.shiftId)?.name||'—')}</div>
        <div class="row" style="margin-top:6px"><span>الدرجة: <b>${x.ev.score}/100</b></span><span>الحضور: <b>${x.ev.attendancePct}%</b></span></div>
        <div class="muted" style="margin-top:4px">غياب: ${x.ev.counts.absentFull} كامل / ${x.ev.counts.absentHalf} نصف • تأخير: ${x.ev.counts.lateEntry2h} • جزاءات: ${x.ev.counts.penaltyHalf+x.ev.counts.penaltyFull}</div>
      </div>`;}).join(''):'<div class="card">لا توجد بيانات لعرضها.</div>'}
    </div>
  </div>`;
}
function printRankingReport(){
  const list=computeRanking();
  if(!list.length){toast('لا توجد بيانات لطباعتها');return;}
  const rows=list.map((x,i)=>[String(i+1),x.w.name,x.w.code,shiftById(x.w.shiftId)?.name||'—',String(x.ev.score),plainLabel(ratingForScore(x.ev.score).label),x.ev.attendancePct+'%',String(x.ev.counts.absentFull+x.ev.counts.absentHalf),String(x.ev.counts.lateEntry2h),String(x.ev.counts.penaltyHalf+x.ev.counts.penaltyFull)]);
  canvasReport('🏆 ترتيب العمال حسب الانضباط والتقييم',['#','العامل','الكود','الشفت','الدرجة','التصنيف','الحضور','الغياب','التأخير','الجزاءات'],rows,'تقرير-ترتيب-العمال');
}

/* -------- سجل التعديلات -------- */
function renderAuditLogScreen(){
  if(!isAdmin())return `<div class="px" style="padding-top:12px"><div class="card">هذه الصفحة للمشرف الرئيسي فقط.</div></div>`;
  const rows=state.auditLog.slice(0,150);
  return `<div class="px" style="padding-top:12px">
    <div class="row"><h3 style="margin:0">🔐 سجل التعديلات</h3><button class="btn btn-secondary btn-sm" onclick="setScreen('workerEval')">⬅️ رجوع</button></div>
    <div style="margin-top:12px">${rows.length?rows.map(a=>`<div class="card"><div class="row"><b>${auditActionLabel(a.action)}</b><span class="muted">${new Date(a.at).toLocaleString('ar-EG')}</span></div><div class="muted" style="margin-top:4px">بواسطة: ${escapeHtml(a.by||'—')}</div>${a.action==='sick_toggle'?`<div class="muted" style="margin-top:4px">من: ${a.before?'محتسب':'غير محتسب'} ← إلى: ${a.after?'محتسب':'غير محتسب'}</div>`:''}</div>`).join(''):'<div class="card">لا يوجد سجل تعديلات بعد.</div>'}</div>
  </div>`;
}

/* -------- حذف عامل (👷 إدارة العمال) -------- */
function deleteWorker(id){
  const w=workerById(id); if(!w)return;
  if(!isAdmin()){toast('غير مصرح لك بحذف العمال');return;}
  if(!confirm(`هل أنت متأكد من حذف العامل ${w.name} نهائيًا؟ لا يمكن التراجع عن هذا الإجراء.`))return;
  state.workers=state.workers.filter(x=>x.id!==id);
  auditAdd('worker_delete',{workerId:id,name:w.name,code:w.code});
  syncMark('worker_delete',{id});
  queueSave();toast('تم حذف العامل نهائيًا');renderApp();
}
function renderWorkerCard(w){
  const shift=shiftById(w.shiftId), dept=DEPARTMENTS.find(d=>d.key===w.deptKey);
  return `<div class="card worker-card-item" data-name="${escapeHtml(w.name)}" data-code="${escapeHtml(w.code)}">
    <div class="row"><div><b style="font-size:15px;display:block">${escapeHtml(w.name)}</b><span class="muted">${escapeHtml(w.code)}</span></div><span class="badge ${w.active?'success':'danger'}">${w.active?'🟢 نشط':'🔴 غير نشط'}</span></div>
    <div style="margin-top:10px;font-size:12.5px;display:grid;grid-template-columns:1fr 1fr;gap:6px"><div>الشفت: <b>${shift?escapeHtml(shift.name):'غير محدد'}</b></div><div>القسم: <b>${dept?escapeHtml(dept.ar):'غير محدد'}</b></div></div>
    <div style="margin-top:12px;display:flex;gap:6px"><button class="btn btn-secondary btn-sm" style="flex:1" onclick="openEditWorkerModal('${w.id}')">✏️ تعديل</button><button class="btn ${w.active?'btn-danger':'btn-primary'} btn-sm" onclick="toggleWorkerActive('${w.id}')">${w.active?'تعطيل':'تفعيل'}</button></div>
    <div style="margin-top:8px;display:flex;gap:6px"><button class="btn btn-secondary btn-sm" style="flex:1" onclick="openAddStatusModal('${w.id}')">📋 حالة</button><button class="btn btn-secondary btn-sm" style="flex:1" onclick="openWorkerEvalDetailScreen('${w.id}')">📊 تقييم</button><button class="btn btn-danger btn-sm" onclick="deleteWorker('${w.id}')">🗑️ حذف</button></div>
  </div>`;
}

/* -------- ربط الشاشات الجديدة بالتنقل والداشبورد (بدون حذف أي شيء موجود) -------- */
const _oldRenderToolsCards_perm=renderToolsCards;
renderToolsCards=function(){
  const base=_oldRenderToolsCards_perm();
  const extra=`<button class="btn btn-secondary" onclick="setScreen('workerStatus')">📋 الإذونات والحالات</button><button class="btn btn-secondary" onclick="setScreen('workerEval')">📊 تقييم وانضباط العمال</button><button class="btn btn-secondary" onclick="setScreen('workerRanking')">🏆 ترتيب العمال</button>`;
  return base.replace('</div></div>', extra+'</div></div>');
};

const _oldRenderApp_perm=renderApp;
renderApp=function(){
  ensureV2State();
  const u=currentUser();
  const newScreens=['workerStatus','workerEval','workerRanking','auditLog'];
  if(u && u.id!==undefined && newScreens.includes(state.activeScreen)){
    document.documentElement.setAttribute('data-theme', state.theme);
    document.getElementById('themeBtn').textContent = state.theme==='dark'?'☀️':'🌙';
    document.getElementById('appHeader').style.display='flex';
    document.getElementById('bottomNav').style.display='flex';
    document.getElementById('headerRole').textContent = `${u.name} (${u.role==='admin'?'مشرف رئيسي':'مسؤول شفت'})`;
    renderNav();
    const app=document.getElementById('app');
    if(state.activeScreen==='workerStatus')app.innerHTML=renderStatusScreen();
    else if(state.activeScreen==='workerEval')app.innerHTML=renderEvalScreen();
    else if(state.activeScreen==='workerRanking')app.innerHTML=renderRankingScreen();
    else if(state.activeScreen==='auditLog')app.innerHTML=renderAuditLogScreen();
    attachEvents();
    return;
  }
  _oldRenderApp_perm();
};

/* Start only after every V2 override has been installed. */
(async function initApp(){
  await loadState();
  ensureV2State();
  await migratePlaintextPasswords();
  renderApp();
  attachRealtimeSync();
})();

</script>
